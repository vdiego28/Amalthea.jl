name: Documentation

on:
  push:
    branches: [ main ]
    tags: '*'
  pull_request:
    branches: [ main ]

# Build the Rust library from the checked-out source, never from a release
# asset — see the same block in run_tests.yml for why (this job failed the
# same way on 2026-07-25).
env:
  AMALTHEA_RUST_SKIP_DOWNLOAD: "1"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Cache Julia packages
        uses: julia-actions/cache@v3
      - name: Install dependencies and build package
        env:
          PYTHON: # remove PYTHON env variable to make sure packages are installed
        uses: julia-actions/julia-buildpkg@v1
        with:
          ignore-no-cache: true
      - name: Instantiate documentation pkg
        run: julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate();'
      - name: Build documentation
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # If authenticating with GitHub Actions token
        run: julia --project=docs/ docs/make.jl

  deploy:
    name: Deploy documentation
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Cache Julia packages
        uses: julia-actions/cache@v3
      - name: Install dependencies and build package
        env:
          PYTHON: # remove PYTHON env variable to make sure packages are installed
        uses: julia-actions/julia-buildpkg@v1
        with:
          ignore-no-cache: true
      - name: Instantiate documentation pkg
        run: julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate();'
      - name: Build and deploy documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # If authenticating with GitHub Actions token
        run: julia --project=docs/ docs/make.jl

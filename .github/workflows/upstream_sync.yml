name: Check upstream sync

on:
  schedule:
    # Weekly, Monday 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: git remote add upstream https://github.com/LupoLab/Luna.jl.git && git fetch upstream master

      - name: Diff against last-synced base
        id: diff
        run: |
          # Review checkpoint, independent of the frozen performance baseline.
          # Dispositions live in docs/dev/native-port/UPSTREAM_TRIAGE.md.
          REVIEWED=$(cat .github/upstream-reviewed.txt)
          [[ "$REVIEWED" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${REVIEWED}^{commit}"
          git merge-base --is-ancestor "$REVIEWED" upstream/master
          NEW=$(git log --oneline "${REVIEWED}..upstream/master" -- . ':!.github')
          if [ -n "$NEW" ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
            {
              echo "commits<<EOF"
              echo "$NEW"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue on drift
        if: steps.diff.outputs.drift == 'true'
        uses: actions/github-script@v9
        env:
          UPSTREAM_COMMITS: ${{ steps.diff.outputs.commits }}
        with:
          script: |
            const commits = process.env.UPSTREAM_COMMITS;
            const title = 'Upstream Luna.jl has new commits not yet reviewed';
            const body = [
              'The scheduled upstream-sync check found commits on `LupoLab/Luna.jl@master`',
              'since the checkpoint in `.github/upstream-reviewed.txt`.',
              'Review dispositions belong in `docs/dev/native-port/UPSTREAM_TRIAGE.md`:',
              '',
              '```',
              commits,
              '```',
              '',
              'Review each for functional relevance and port as needed.'
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['upstream-sync']
            });
            if (existing.data.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['upstream-sync']
            });

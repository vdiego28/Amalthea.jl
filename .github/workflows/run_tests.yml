name: Run tests

on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CI must always exercise the Rust library built from the *checked-out*
# source, never a published release asset. deps/build.jl keys its prebuilt
# download on the Project.toml version, which still names the last tagged
# release while main has moved ahead of it — so without this, every job
# silently overwrites its freshly-built libamalthea with the v1.0.0 binary
# and dies on the first FFI symbol added since that tag (2026-07-25:
# `undefined symbol: native_compute_extra_stages`). Workflow-level, not
# per-step, so a job added later can't forget it.
env:
  AMALTHEA_RUST_SKIP_DOWNLOAD: "1"

jobs:
  test:
    name: Test (${{ matrix.group }} - ${{ matrix.os }} - Julia ${{ matrix.julia-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Physics group (full OS matrix on stable Julia)
          - os: ubuntu-latest
            julia-version: '1'
            group: physics
            workers: 2
          - os: windows-2025-vs2026
            julia-version: '1'
            group: physics
            workers: 2
          - os: macos-latest
            julia-version: '1'
            group: physics
            # Keep serial: BACKLOG item 11 records an intermittent macOS
            # FFTW SIGBUS even with fresh wisdom.
            workers: 1
          # Physics group (other Julia versions on ubuntu-latest)
          - os: ubuntu-latest
            julia-version: 'lts'
            group: physics
            workers: 2
          - os: ubuntu-latest
            julia-version: 'pre'
            group: physics
            workers: 2

          # Rust FFI group (full OS matrix on stable Julia to verify FFI linking)
          - os: ubuntu-latest
            julia-version: '1'
            group: rust
            workers: 2
          - os: windows-2025-vs2026
            julia-version: '1'
            group: rust
            workers: 2
          - os: macos-latest
            julia-version: '1'
            group: rust
            workers: 1

          # Simulation group — split into 3 parallel jobs to cut wall time:
          #   sim-interface    (~56 prop_capillary calls, the longest job)
          #   sim-multimode    (multimode + polarisation tests)
          #   sim-propagation  (radial, freespace, GNLSE, Kerr, Raman — lighter tests)
          - os: ubuntu-latest
            julia-version: '1'
            group: sim-interface
            workers: 2
          - os: ubuntu-latest
            julia-version: '1'
            group: sim-multimode
            workers: 2
          - os: ubuntu-latest
            julia-version: '1'
            group: sim-propagation
            workers: 2

          # I/O group (ubuntu-latest only)
          - os: ubuntu-latest
            julia-version: '1'
            group: io
            workers: 2

          # Fields group (ubuntu-latest only)
          - os: ubuntu-latest
            julia-version: '1'
            group: fields
            workers: 2

          # Examples smoke group (ubuntu-latest only) — runs a representative
          # subset of examples/low_level_interface/ at a shrunk fibre length
          # so an API change that breaks the documented low-level entry point
          # fails CI (docs/dev/BACKLOG.md "Distribution & example-code
          # maintenance" item 2). See test/test_examples_smoke.jl for what is
          # and isn't covered. ~45s of test time as of 2026-07-22.
          - os: ubuntu-latest
            julia-version: '1'
            group: examples
            workers: 1

    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # This action's built-in rust-cache runs `cargo metadata` at the
          # repo root, where there is no Cargo.toml (the crate lives in
          # amalthea/) — it errors out and caches nothing. The explicit
          # Swatinem/rust-cache steps below (workspaces: amalthea) are the
          # ones that work.
          cache: false

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "amalthea"


      - name: Run Rust unit tests
        if: matrix.group == 'rust'
        run: cargo test
        working-directory: amalthea
        env:
          RUSTFLAGS: "" # neutralize target-cpu=native from .cargo/config.toml

      # Build the release shared library so the Julia FFI tests can load it.
      # Must happen after `cargo test` (which builds debug) and before Julia runs.
      - name: Build Rust release library (for Julia FFI tests)
        if: matrix.group == 'rust'
        run: cargo build --release
        working-directory: amalthea
        env:
          RUSTFLAGS: "" # neutralize target-cpu=native from .cargo/config.toml

      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
          arch: 'default'

      - name: Cache Julia packages
        uses: julia-actions/cache@v3
        with:
          # FFTW wisdom is CPU-specific and macos-latest can move between host
          # CPU models. Excluding scratchspace restore did not by itself stop
          # the intermittent plain-Julia RK45 SIGBUS, but it removes one
          # independent source of unsafe plan reuse while test/runtests.jl
          # serializes FFTW's macOS thread pool (BACKLOG item 11 / PLANS §7.2).
          # Keep every other Julia cache.
          cache-scratchspaces: ${{ runner.os != 'macOS' || matrix.group != 'physics' }}

      - name: Install dependencies and build
        env:
          PYTHON: # remove PYTHON env variable to make sure packages are installed
        uses: julia-actions/julia-buildpkg@v1
        with:
          ignore-no-cache: true

      - name: Add Julia HDF5 artifacts to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hdf5path = julia --project -e "using HDF5; print(HDF5.API.libhdf5)"
          $hdf5dir = Split-Path -Path $hdf5path -Parent
          echo "$hdf5dir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Use the same timing-aware LPT scheduler as the local full gate. Each
      # worker is a separate Julia process; the scheduler bounds Julia,
      # OpenBLAS, and OMP threads against the shared CPU budget.
      - name: Run tests (balanced ${{ matrix.workers }}-worker bucket)
        run: >-
          python test/parallel_group_tests.py
          --group "${{ matrix.group }}"
          --max-workers "${{ matrix.workers }}"
          --ci
        env:
          # Disable strict HDF5 file locking ONLY on Windows runners
          HDF5_USE_FILE_LOCKING: ${{ runner.os == 'Windows' && 'FALSE' || 'TRUE' }}

  benchmark:
    name: Native-path benchmark (regression guard)
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # This action's built-in rust-cache runs `cargo metadata` at the
          # repo root, where there is no Cargo.toml (the crate lives in
          # amalthea/) — it errors out and caches nothing. The explicit
          # Swatinem/rust-cache steps below (workspaces: amalthea) are the
          # ones that work.
          cache: false

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "amalthea"

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
          arch: 'default'

      - name: Cache Julia packages
        uses: julia-actions/cache@v3

      - name: Install dependencies and build
        env:
          PYTHON: # remove PYTHON env variable to make sure packages are installed
        uses: julia-actions/julia-buildpkg@v1
        with:
          ignore-no-cache: true

      # BACKLOG.md Phase G.3 — a lone dedicated job (not part of the sharded
      # test matrix) so a slow/noisy shared runner can't contaminate the
      # timing with unrelated load. test/benchmark_native_default.jl hard-
      # asserts the fork's flagship default field-resolved workload (no env
      # toggles) actually picks RustNativeStepper — the Phase C / REVIEW.md
      # §3.2 regression, which showed up as a silent 0x-speedup fallback
      # with no CI failure at all until this job existed — then writes
      # native's own fixed-dt per-step wall time to a JSON file.
      - name: Run native-path benchmark
        run: julia --project test/benchmark_native_default.jl

      # The publisher runs as a separate write-scoped job, so this benchmark
      # job remains read-only on pull requests and non-main pushes.
      - name: Upload benchmark result for main-branch publisher
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: native-benchmark-result
          path: test/benchmark_result.json
          if-no-files-found: error
          retention-days: 1

  benchmark-publish:
    name: Publish native-path benchmark
    needs: benchmark
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: native-benchmark-result
          path: benchmark-result
      - name: Store benchmark result and check for regressions
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'customSmallerIsBetter'
          output-file-path: benchmark-result/benchmark_result.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # Documenter's deploydocs (documenter.yml) deploys push-to-main docs
          # under gh-pages:dev/ by default, clearing that folder on each
          # deploy. Keep benchmark history out of the way of that path
          # instead of at this action's own default (dev/bench).
          benchmark-data-dir-path: bench
          alert-threshold: '150%'
          # Keep this publisher at contents-only permission; alert comments
          # would require issues/pull-requests write access.
          comment-on-alert: false
          fail-on-alert: true

  python-test:
    name: Python API Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # As above: the built-in rust-cache errors out at the repo root and
          # caches nothing. This job builds the crate once and has no explicit
          # cache step, so just turn the broken one off.
          cache: false

      - name: Build Rust release library (for Julia FFI)
        run: cargo build --release
        working-directory: amalthea
        env:
          RUSTFLAGS: ""

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'

      - name: Cache Julia packages
        uses: julia-actions/cache@v3

      - name: Install Julia dependencies
        uses: julia-actions/julia-buildpkg@v1
        with:
          ignore-no-cache: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python Package & pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e "./python[test]"

      - name: Run Python API tests
        run: |
          pytest python/tests/ test/test_parallel_group_tests.py
        env:
          PYTHON_JULIAPKG_JULIA: julia
          # This job builds the Rust library and installs Julia above, so the
          # integration tests' "backend unavailable" skip must be a failure
          # here — otherwise a backend that loads but is broken (e.g. the
          # stale-prebuilt undefined symbol of 2026-07-25) is reported as a
          # green run with four skips. See python/tests/test_integration.py.
          AMALTHEA_REQUIRE_INTEGRATION: "1"

version: 2
updates:
  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "CI"
      - "dependencies"

  # Keep Julia packages up to date
  - package-ecosystem: "julia"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "Julia"
      - "dependencies"

  # Keep Rust/Cargo dependencies up to date
  - package-ecosystem: "cargo"
    directory: "/amalthea"
    schedule:
      interval: "monthly"
    labels:
      - "Rust"
      - "dependencies"

  # The standalone Python binding has its own Cargo manifest and lockfile.
  - package-ecosystem: "cargo"
    directory: "/python-native"
    schedule:
      interval: "monthly"
    labels:
      - "Rust"
      - "dependencies"

  # Python dependency manifests are independent of their Rust/Julia backends.
  - package-ecosystem: "pip"
    directory: "/python"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"

  - package-ecosystem: "pip"
    directory: "/python-native"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"

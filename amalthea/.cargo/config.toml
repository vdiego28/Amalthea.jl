# Cargo build configuration for amalthea
#
# target-cpu=native tells rustc/LLVM to optimise for the CPU on which the
# library is compiled, enabling the instruction sets available on that host.
#
# NOTE: the resulting .so is NOT portable to older CPUs. This is intentional
# for local development only. The detection-only dispatcher in dispatch.rs
# cannot make code compiled with host-specific instructions portable.
#
# Package and portable CI/release builds override this with RUSTFLAGS="".
# Explicit user-supplied RUSTFLAGS remain the user's portability choice.
[build]
rustflags = ["-C", "target-cpu=native"]

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1

[package]
name = "amalthea-python"
version = "0.0.1"
edition = "2024"
description = "Private portable FFT bindings for the Amalthea Python frontend"
license = "MIT"
repository = "https://github.com/vdiego28/Amalthea.jl"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27.2", features = ["extension-module", "num-complex"] }
rustfft = "6.4"
realfft = "3.5"
amalthea = { path = "../amalthea" }

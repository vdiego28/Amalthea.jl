[package]
name = "amalthea-python"
version = "0.0.1"
edition = "2024"
description = "Standalone CPU simulation bindings for the Amalthea Python frontend"
license = "MIT"
repository = "https://github.com/vdiego28/Amalthea.jl"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27.2", features = ["extension-module", "num-complex"] }
numpy = "=0.27.1"
rustfft = "6.4"
amalthea = { path = "../amalthea" }

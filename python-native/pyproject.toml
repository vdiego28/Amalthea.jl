[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "amalthea-native"
version = "0.1.0"
description = "Julia-free nonlinear optical pulse propagation with a Rust CPU solver"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.15", "CoolProp==8.0.0", "mpmath>=1.3,<2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Documentation = "https://vdiego28.github.io/Amalthea.jl/stable/python_native.html"
Repository = "https://github.com/vdiego28/Amalthea.jl"
Issues = "https://github.com/vdiego28/Amalthea.jl/issues"

[project.optional-dependencies]
hdf5 = ["h5py>=3.11"]

[tool.maturin]
python-source = "python"
module-name = "amalthea_native._native"
include = [{ path = ".cargo/config.toml", format = "sdist" }]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/*.pyo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
